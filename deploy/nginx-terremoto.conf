# /etc/nginx/sites-available/terremoto
#
# Reemplace SU_DOMINIO_O_IP por el dominio, o por la IP externa de la VM
# mientras no haya dominio. Despues de editar:
#
#   sudo ln -s /etc/nginx/sites-available/terremoto /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name SU_DOMINIO_O_IP;

    root /var/www/terremoto/public;
    index index.php;

    charset utf-8;

    # La vista publica se usa con mala señal: comprimir baja mucho el peso.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Leaflet y los assets de Filament no cambian entre despliegues.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /var/log/nginx/terremoto-error.log;
    access_log /var/log/nginx/terremoto-access.log;
}
