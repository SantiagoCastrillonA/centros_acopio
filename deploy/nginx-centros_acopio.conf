# /etc/nginx/sites-available/centros_acopio
#
# Reemplace SU_DOMINIO_O_IP por el dominio, o por la IP externa de la VM
# mientras no haya dominio. Despues de editar:
#
#   sudo ln -s /etc/nginx/sites-available/centros_acopio /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name SU_DOMINIO_O_IP;

    root /var/www/centros_acopio/public;
    index index.php;

    charset utf-8;

    # La vista publica se usa con mala señal: comprimir baja mucho el peso.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # El service worker NO se cachea: si el navegador se queda con una
    # version vieja, sigue sirviendo paginas viejas aunque haya senal.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        expires 1d;
        types { } default_type application/manifest+json;
        try_files $uri =404;
    }

    # Leaflet y los assets de Filament no cambian entre despliegues.
    #
    # El fallback a index.php NO es opcional: Livewire sirve su propio
    # livewire.min.js desde una ruta de PHP, no desde un archivo en disco.
    # Con try_files $uri =404 aqui, el panel carga pero el formulario de
    # login queda muerto.
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|woff2|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log /var/log/nginx/centros_acopio-error.log;
    access_log /var/log/nginx/centros_acopio-access.log;
}
